name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix server audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finpro-ai:ci .
      - name: Smoke test
        run: |
          docker run -d --name finpro -p 8787:8787 -e NODE_ENV=production -e APP_ORIGIN=https://ci.example.com finpro-ai:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/meta
          curl -fsS -o /dev/null http://127.0.0.1:8787/
          docker logs finpro
