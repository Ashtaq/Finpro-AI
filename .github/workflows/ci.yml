name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix server audit --omit=dev --audit-level=high

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI_Assistant_Code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: AI_Assistant_Code/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: [check, ai-service]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finpro-ai:ci .
      - name: Smoke test
        run: |
          docker run -d --name finpro -p 8787:8787 -e NODE_ENV=production -e APP_ORIGIN=https://ci.example.com finpro-ai:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/meta
          curl -fsS -o /dev/null http://127.0.0.1:8787/
          docker logs finpro
      - name: Build and smoke-test AI service image
        run: |
          docker build -t finpro-ai-assistant:ci AI_Assistant_Code
          docker run -d --name ai -p 8090:8090 -e AI_ENV=production -e AI_SERVICE_TOKEN=ci-token-0123456789abcdef0123456789abcdef \
            -e AI_FAST_PROVIDER=hosted -e AI_HOSTED_BASE_URL=https://example.invalid/v1 -e AI_HOSTED_API_KEY=x -e AI_HOSTED_MODEL=m finpro-ai-assistant:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/v1/chat)" = "401"
          docker logs ai
